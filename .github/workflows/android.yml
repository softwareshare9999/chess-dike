# Build signed release APKs and publish a GitHub Release for download.
#
# Trigger policy for this fork: on every push to main and on manual dispatch.
# (Upstream restricts builds to stable-* tags; this fork deliberately keeps
# every-push builds so a downloadable APK is always available.)
#
# 版权物注入：ONNX 识别模型与桔库开局库不进 git（版权红线），需一次性上传到本仓
# Release 的 assets 标签（prerelease）。构建时经 gh 下载注入；缺资产时自检步直接
# 失败并提示上传，不产出缺件的残废包。
name: Build-XQDK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # versionCode = git commit count (see app/build.gradle.kts gitVersion)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      # 版权物注入：ONNX 模型文件名硬编码于 OnnxBoardRecognizer.kt，保持原名直接落
      # models/；桔库文件名硬编码于 BHDatabase.java（桔库09.09.2023精修库.obk），
      # assets Release 侧存 ASCII 名规避中文资源名的 URL 编码问题，此处改名落位。
      - name: Download copyrighted assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets/models app/src/main/assets/databases
          gh release download assets --repo "$GITHUB_REPOSITORY" \
            --pattern "*.onnx" --dir app/src/main/assets/models --clobber
          gh release download assets --repo "$GITHUB_REPOSITORY" \
            --pattern "XQDK-obk.zip" --dir app/src/main/assets/databases --clobber
          mv app/src/main/assets/databases/XQDK-obk.zip \
             "app/src/main/assets/databases/桔库09.09.2023精修库.obk.zip"

      # 缺资产立即失败：宁可不出包，不出缺件的残废包
      - name: Verify assets
        run: |
          test -s "app/src/main/assets/models/4_v6-0301.onnx" \
            || { echo "::error::Missing ONNX corner model — upload 4_v6-0301.onnx to the 'assets' release"; exit 1; }
          test -s "app/src/main/assets/models/nano_v3-0319.onnx" \
            || { echo "::error::Missing ONNX classifier model — upload nano_v3-0319.onnx to the 'assets' release"; exit 1; }
          test -s "app/src/main/assets/databases/桔库09.09.2023精修库.obk.zip" \
            || { echo "::error::Missing opening book — upload XQDK-obk.zip to the 'assets' release"; exit 1; }
          ls -la app/src/main/assets/models app/src/main/assets/databases

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Unit tests
        run: ./gradlew :app:testArmv8DebugUnitTest --no-daemon --console=plain

      - name: Assemble Release APKs
        run: ./gradlew assembleArmv8Release assembleArmv8-dotprodRelease --no-daemon --console=plain

      - name: Collect APKs
        id: apk
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \;
          cd dist
          for f in *.apk; do
            zip "${f%.apk}.zip" "$f"
          done
          ls -lh
          echo "ver=$(git rev-list HEAD --count)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XQDK-apks
          path: dist/*.apk

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.apk.outputs.ver }}"
          TAG="v${VER}"
          NOTES="XQDK automatic build (versionCode=${VER}). Download a .zip, extract the .apk, and install on an Android device.

          - \`*_armv8-dotprod-release.apk\`: recommended; needs ARMv8.2 dotprod (Snapdragon 855 / Kirin 990 / Dimensity 1000 and up)
          - \`*_armv8-release.apk\`: compatible variant for older CPUs

          > **Signing**: the CI runner has no release keystore, so these APKs are **debug-signed** —
          > they cannot install over an existing release-signed build; uninstall first."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/*.zip --title "Release ${VER}" --notes "$NOTES"
          fi
          echo "Release URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"
