# Build signed release APKs and publish a GitHub Release for download.
name: Build-XQDK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # versionCode = git commit count (see app/build.gradle.kts gitVersion)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Assemble Release APKs
        run: ./gradlew assembleArmv8-Release assembleArmv8-dotprod-Release --stacktrace

      - name: Collect APKs
        id: apk
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \;
          cd dist
          for f in *.apk; do
            zip "${f%.apk}.zip" "$f"
          done
          ls -lh
          echo "ver=$(git rev-list HEAD --count)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.apk.outputs.ver }}"
          TAG="v${VER}"
          NOTES="XQDK automatic build (versionCode=${VER}). Download a .zip, extract the .apk, and install on an Android device."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/*.zip --title "Release ${VER}" --notes "$NOTES"
          fi
          echo "Release URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"
